<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Geri Sayım</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 1.8rem;
            color: #38bdf8;
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .time-box {
            background: #0f172a;
            padding: 15px 20px;
            border-radius: 10px;
            min-width: 75px;
            border: 1px solid #334155;
        }

        .time-box span {
            display: block;
            font-size: 2.2rem;
            font-weight: bold;
            color: #f1f5f9;
        }

        .time-box label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        #message {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Büyük Etkinliğe Kalan Süre</h1>
        
        <div class="timer" id="countdownTimer">
            <div class="time-box">
                <span id="days">00</span>
                <label>Gün</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>Saat</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>Dakika</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>Saniye</label>
            </div>
        </div>

        <div id="message"></div>
    </div>

    <script>
        // 1. ADIM: Hedef tarihi buraya YYYY-MM-DDTHH:MM:SS formatında yazın.
        // Bu tarih bulut gibi sabit kalacak, herkes bu ortak tarihten geriye sayacak.
        // Örnek olarak şu andan tam 2 ay sonrasını (22 Aralık 2026 16:00) hedef seçtik:
        const TARGET_DATE = new Date("2026-12-22T16:00:00").getTime();

        async function updateCountdown() {
            let now;
            
            try {
                // 2. ADIM: Kullanıcının bilgisayar saatinin yanlış olması ihtimaline karşı,
                // Dünya Saati sunucusundan (Buluttan) anlık gerçek zamanı çekiyoruz.
                const response = await fetch('https://worldtimeapi.org');
                const data = await response.json();
                now = new Date(data.utc_datetime).getTime();
            } catch (error) {
                // Eğer anlık olarak internet/API kesilirse yedek olarak yerel saati kullanır
                now = new Date().getTime();
            }

            const distance = TARGET_DATE - now;

            const daysElem = document.getElementById('days');
            const hoursElem = document.getElementById('hours');
            const minutesElem = document.getElementById('minutes');
            const secondsElem = document.getElementById('seconds');
            const messageElem = document.getElementById('message');

            if (distance < 0) {
                daysElem.innerText = "00";
                hoursElem.innerText = "00";
                minutesElem.innerText = "00";
                secondsElem.innerText = "00";
                messageElem.innerText = "Süre Tamamlandı!";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            daysElem.innerText = String(days).padStart(2, '0');
            hoursElem.innerText = String(hours).padStart(2, '0');
            minutesElem.innerText = String(minutes).padStart(2, '0');
            secondsElem.innerText = String(seconds).padStart(2, '0');
        }

        // İlk açılışta veriyi çek ve ardından her saniye senkronize şekilde çalıştır
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
